<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Analysis Results</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #007bff;
            --background-color: #f8f9fa;
            --container-background: #ffffff;
            --text-color: #212529;
            --light-text: #6c757d;
            --border-color: #dee2e6;
            --shadow: 0 4px 12px rgba(0,0,0,0.08);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            margin: 0;
            padding: 2rem;
        }
        .main-container { max-width: 1600px; margin: auto; }
        header { text-align: center; margin-bottom: 2rem; }
        h1 { color: var(--text-color); font-weight: 700; }
        .content-grid {
            display: grid;
            grid-template-columns: 300px 1fr; /* Controls on left, chart on right */
            gap: 2rem;
            align-items: flex-start;
        }
        .chart-container {
            background: var(--container-background);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }
        .controls-container {
            background: var(--container-background);
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: var(--shadow);
        }
        .controls-container h2 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }
        .control-item, .summary-item {
            margin-bottom: 1.25rem;
        }
        .control-item label, .summary-item .label {
            font-weight: 600;
            color: var(--text-color);
            display: block;
            margin-bottom: 0.5rem;
        }
        .summary-item .value { font-size: 1.1rem; color: var(--light-text); }
        select {
            width: 100%;
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
        }
        .actions { margin-top: 2rem; text-align: center; }
        a.button {
            display: inline-block; padding: 0.8rem 1.5rem; border-radius: 5px;
            text-decoration: none; font-weight: 600; transition: all 0.3s ease;
            width: 100%; box-sizing: border-box;
        }
        a.download-btn { background-color: var(--primary-color); color: white; margin-bottom: 1rem; }
        a.download-btn:hover { background-color: #0056b3; }
        a.back-btn { color: var(--primary-color); background-color: transparent; }
        a.back-btn:hover { text-decoration: underline; }

        @media (max-width: 992px) {
            .content-grid { grid-template-columns: 1fr; }
            .controls-container { order: -1; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <header>
            <h1>Growth vs. Sentiment Analysis</h1>
        </header>

        <div class="content-grid">
            <div class="controls-container">
                <h2>Chart Controls</h2>
                <div class="control-item">
                    <label for="color-by-select">Color Bubbles By:</label>
                    <select id="color-by-select">
                        <option value="Category" selected>Category</option>
                        <option value="Market">Market</option>
                    </select>
                </div>
                <div class="control-item">
                    <label for="size-by-select">Size Bubbles By:</label>
                    <select id="size-by-select">
                        <option value="search_volume_12m_avg" selected>Search Volume (12m Avg)</option>
                        <option value="growth_pct">Growth (%)</option>
                        <option value="results_analysed">Results Analysed</option>
                    </select>
                </div>

                <h2 style="margin-top: 2rem;">Analysis Summary</h2>
                <div class="summary-item">
                    <span class="label">Total Keywords</span>
                    <span class="value">{{ summary.total_keywords }}</span>
                </div>
                <div class="summary-item">
                    <span class="label">Avg. Sentiment</span>
                    <span class="value">{{ summary.avg_sentiment }}</span>
                </div>

                <div class="actions">
                    <a href="/download-csv/{{ file_id }}" class="button download-btn">Download Data (CSV)</a>
                    <a href="/" class="button back-btn">← New Analysis</a>
                </div>
            </div>

            <div class="chart-container">
                <!-- The interactive chart from Plotly will be injected here -->
                <div id="bubble-chart">{{ chart_html | safe }}</div>
            </div>
        </div>
    </div>

    <script id="chart-data" type="application/json">
        {{ chart_data_json | safe }}
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const chartDiv = document.getElementById('bubble-chart');
            const chartData = JSON.parse(document.getElementById('chart-data').textContent);

            const colorSelect = document.getElementById('color-by-select');
            const sizeSelect = document.getElementById('size-by-select');

            function updateChart() {
                const colorBy = colorSelect.value;
                const sizeBy = sizeSelect.value;

                // The values for marker.color need to be numerical for a colorscale,
                // or categorical strings that Plotly can map to colors.
                // We create a numerical mapping for the categorical data.
                const colorData = chartData[colorBy];
                const uniqueCategories = [...new Set(colorData)];
                const colorIndices = colorData.map(val => uniqueCategories.indexOf(val));

                Plotly.restyle(chartDiv, {
                    'marker.color': [colorIndices],
                    'marker.size': [chartData[sizeBy]],
                });

                // Update the legend title
                Plotly.update(chartDiv, {}, {
                    'legend.title.text': `Color By: ${colorBy}`
                });
            }

            colorSelect.addEventListener('change', updateChart);
            sizeSelect.addEventListener('change', updateChart);
        });
    </script>
</body>
</html>
